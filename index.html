<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="日常粵語打字練習 — 由最常用嘅廣東話短句開始，練字同時睇粵拼、倉頡碼同速成碼。">
  <meta name="theme-color" content="#f4f0e8">
  <title>日常粵語 · 打字練習</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-seal" aria-hidden="true">粵</span>
      <span class="brand-text">
        <span class="brand-name">日常粵語</span>
        <span class="brand-sub">Cantonese, every day</span>
      </span>
    </div>
    <button class="reset-btn" id="resetBtn" type="button">重設進度</button>
  </header>

  <main class="shell">
    <section class="practice" aria-labelledby="practiceLabel">
      <div class="topline">
        <p class="eyebrow" id="practiceLabel">高頻短句 · 由最常用開始</p>
        <p class="counter" aria-label="第 1 句，共 100 句">
          <span id="counterCurrent">001</span><span class="counter-slash">/</span><span id="counterTotal">100</span>
        </p>
      </div>
      <div class="progress" id="progress" role="progressbar" aria-label="練習進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="progress-fill" id="progressFill"></span>
      </div>

      <div id="practiceBody">
        <div class="stage" id="stage">
          <div class="stage-meta">
            <span class="chip" id="category">應對</span>
            <span class="chip chip-colloquial" id="colloquial">口語</span>
          </div>
          <div class="phrase" id="phrase"></div>
          <p class="gloss" id="gloss"></p>
          <span class="stamp" id="stamp" aria-hidden="true">好嘢</span>
        </div>

        <section class="hint" aria-labelledby="hintTitle">
          <div class="hint-head">
            <p class="eyebrow" id="hintTitle">提示 · Hints</p>
            <button class="reveal-btn" id="revealBtn" type="button" aria-expanded="false" aria-controls="hintTableWrap">
              <svg class="eye eye-open" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
                <circle cx="12" cy="12" r="2.6"/>
              </svg>
              <svg class="eye eye-closed" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 4l16 16"/>
                <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6 0 9.5 7 9.5 7a16.4 16.4 0 0 1-2.4 3.2M6.6 6.7A16.7 16.7 0 0 0 2.5 12S6 19 12 19a10 10 0 0 0 4.1-.9"/>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
              </svg>
              <span id="revealLabel">顯示提示</span>
            </button>
          </div>
          <div class="hint-body" id="hintTableWrap" hidden>
            <table class="hint-table" id="hintTable" aria-hidden="true"></table>
          </div>
        </section>

        <section class="typing" aria-label="打字練習">
          <label class="sr-only" for="typeInput">輸入上面嘅粵語句子</label>
          <input
            class="type-input"
            id="typeInput"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="next"
            placeholder="喺度打…"
          >
          <div class="typing-meta">
            <p class="feedback" id="feedback" data-tone="">打啱晒就會自動去下一句。</p>
            <p class="keyhint"><kbd>Enter</kbd> 下一句</p>
          </div>
        </section>

        <div class="stats" aria-label="練習統計">
          <div class="stat">
            <span class="stat-value" id="cpm">0</span>
            <span class="stat-label">字 / 分</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="accuracy">100%</span>
            <span class="stat-label">準確度</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="completed">0</span>
            <span class="stat-label">今次完成</span>
          </div>
        </div>

        <div class="controls">
          <button class="nav-btn" id="prevBtn" type="button">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
            上一句
          </button>
          <button class="nav-btn nav-btn-primary" id="nextBtn" type="button">
            下一句
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>

      <div class="finish" id="finish" hidden>
        <div class="finish-seal" aria-hidden="true">完</div>
        <h2>練完喇！</h2>
        <p class="finish-lead">你已經行到最後一句。每日練幾句，好快就變成本能。</p>
        <div class="finish-stats">
          <div class="finish-stat">
            <strong id="finishCompleted">0</strong>
            <span>句完成</span>
          </div>
          <div class="finish-stat">
            <strong id="finishAccuracy">100%</strong>
            <span>平均準確度</span>
          </div>
          <div class="finish-stat">
            <strong id="finishBest">0</strong>
            <span>最快字 / 分</span>
          </div>
        </div>
        <button class="cta" id="restartBtn" type="button">再嚟一次</button>
      </div>
    </section>

    <footer class="site-footer">
      <p>粵拼 Jyutping · 倉頡第五代 · 速成取首尾碼</p>
      <p>由最常用開始，共 <span id="footerTotal">100</span> 句日常粵語。</p>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="announce" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
